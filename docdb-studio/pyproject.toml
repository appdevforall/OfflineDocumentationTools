[project]
name = "docdb-studio"
version = "0.1.0"
description = "Desktop UI for browsing and editing the IDE tooltip + content database"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet >= 0.27",
    "flet-datatable2",
    "brotli >= 1.0",
    "posthog >= 3.0",
]

[tool.uv]
package = false
dev-dependencies = [
    "pytest >= 8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
